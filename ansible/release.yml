---
- hosts: all
  gather_facts: no
  tasks:
    - community.docker.docker_network:
        name: devops-example

    - community.docker.docker_container:
        name: app
        image: "john386/devops-example-app:{{ version }}"
        restart_policy: always
        state: started
        networks:
          - name: devops-example
        ports:
          - 3000:3000
        env:
          NODE_ENV: production
