name: main

on:
  push:
    branches:
      - "main"

env:
  IMAGE_APP_NAME: "john386/devops-example-app"
  IMAGE_CADDY_NAME: "john386/devops-example-caddy"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and export Docker
        uses: docker/puild-push-action@v4
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_APP_NAME }}:test

      - run: make compose-test-ci
      - run: make compose-lint-ci

      - name: Build and push app
        uses: docker/puild-push-action@v4
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          push: true
          tags: ${{ env.IMAGE_APP_NAME }}:latest

      - name: Build and push caddy
        uses: docker/puild-push-action@v4
        with:
          context: .
          file: services/caddy/Dockerfile
          push: true
          tags: ${{ env.IMAGE_CADDY_NAME }}:latest
