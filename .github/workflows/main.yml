name: main

on:
  push:
    branches:
      - "main"

permissions: {}

env:
  TEST_TAG: "john386/devops-example-app:test"
  APP_NAME_IMAGE: "john386/devops-example-app:latest"
  CADDY_NAME_IMAGE: "john386/devops-example-caddy:latest"

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and export to Docker
        uses: docker/build-push-action@v4
        with:
          context: .
          load: true
          tags: ${{ env.TEST_TAG }}

      - run: make compose-test-ci
      - run: make compose-lint-ci

      - name: Build and push app
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          push: true
          tags: ${{ env.APP_NAME_IMAGE }}

      - name: Build and push caddy
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./services/caddy/Dockerfile
          platforms: linux/amd64, linux/arm64
          push: true
          tags: ${{ env.CADDY_NAME_IMAGE }}
