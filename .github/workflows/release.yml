name: release

on:
  push:
    tags:
      - v*
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  APP_IMAGE_NAME: "john386/devops-example-app"
  CADDY_IMAGE_NAME: "john386/devops-example-caddy"

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - run: docker buildx imagetools create -t ${{ env.APP_IMAGE_NAME }}:"$REF_NAME" ${{ env.APP_IMAGE_NAME }}:latest
      - run: docker buildx imagetools create -t ${{ env.CADDY_IMAGE_NAME }}:"$REF_NAME" ${{ env.CADDY_IMAGE_NAME }}:latest
