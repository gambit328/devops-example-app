name: release

on:
  push:
    tags:
      - v*

env:
  IMAGE_APP_NAME: "john386/devops-example-app"
  IMAGE_CADDY_NAME: "john386/devops-example-caddy"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - run: docker buildx imagetools create -t ${{ env.IMAGE_APP_NAME }}:${{ github.ref_name }} ${{ env.IMAGE_APP_NAME }}:latest
      - run: docker buildx imagetools create -t ${{ env.IMAGE_CADDY_NAME }}:${{ github.ref_name }} ${{ env.IMAGE_CADDY_NAME }}:latest
