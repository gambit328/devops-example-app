name: release

on:
  push:
    tags:
      - v*

env:
  APP_IMAGE_NAME: hexletcomponents/devops-example-app
  CADDY_IMAGE_NAME: hexletcomponents/devops-example-caddy
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # imagetools переносит манифест целиком; pull/tag/push схлопывал его в платформу раннера
      - run: docker buildx imagetools create -t ${{ env.APP_IMAGE_NAME }}:"$REF_NAME" ${{ env.APP_IMAGE_NAME }}:latest
      - run: docker buildx imagetools create -t ${{ env.CADDY_IMAGE_NAME }}:"$REF_NAME" ${{ env.CADDY_IMAGE_NAME }}:latest
